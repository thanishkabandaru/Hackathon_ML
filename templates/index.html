<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🚗 AI Car Price Predictor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="animated-bg">

<div class="container">

  <h1 style="color: #801010; font-weight: 700; text-shadow: 2px 2px 10px rgba(0,0,0,0.5);">
    🚗 Car Price Predictor
  </h1>
  <p class="subtitle">Know the right price before you buy or sell!</p>

  <form action="/predict" method="post" class="card">

    <div class="form-grid">

      <div class="input-group">
        <label>Original Price (Lakhs)</label>
        <i class="fas fa-money-bill neon-icon"></i>
        <input type="number" step="0.01" name="present_price" 
               value="{{ request.form.present_price | default('') }}" required>
      </div>

      <div class="input-group">
        <label>Kilometers Driven</label>
        <i class="fas fa-road neon-icon"></i>
        <input type="number" name="kms_driven" 
               value="{{ request.form.kms_driven | default('') }}" required>
      </div>

      <div class="input-group">
        <label>Year of Purchase</label>
        <i class="fas fa-calendar neon-icon"></i>
        <input type="number" name="year" 
               value="{{ request.form.year | default('') }}" required>
      </div>

      <div class="input-group">
        <label>Owner</label>
        <i class="fas fa-user neon-icon"></i>
        <select name="owner">
          <option value="0" {% if request.form.owner == '0' %}selected{% endif %}>First Owner</option>
          <option value="1" {% if request.form.owner == '1' %}selected{% endif %}>Second Owner</option>
          <option value="2" {% if request.form.owner == '2' %}selected{% endif %}>Third Owner</option>
        </select>
      </div>

      <div class="input-group">
        <label>Fuel Type</label>
        <i class="fas fa-gas-pump neon-icon"></i>
        <select name="fuel">
          <option value="Petrol" {% if request.form.fuel == 'Petrol' %}selected{% endif %}>Petrol</option>
          <option value="Diesel" {% if request.form.fuel == 'Diesel' %}selected{% endif %}>Diesel</option>
        </select>
      </div>

      <div class="input-group">
        <label>Seller Type</label>
        <i class="fas fa-store neon-icon"></i>
        <select name="seller">
          <option value="Dealer" {% if request.form.seller == 'Dealer' %}selected{% endif %}>Dealer</option>
          <option value="Individual" {% if request.form.seller == 'Individual' %}selected{% endif %}>Individual</option>
        </select>
      </div>

      <div class="input-group">
        <label>Transmission</label>
        <i class="fas fa-cogs neon-icon"></i>
        <select name="transmission">
          <option value="Manual" {% if request.form.transmission == 'Manual' %}selected{% endif %}>Manual</option>
          <option value="Automatic" {% if request.form.transmission == 'Automatic' %}selected{% endif %}>Automatic</option>
        </select>
      </div>

    </div>

    <button type="submit" class="predict-btn">Predict Price</button>

  </form>

  {% if prediction_text %}
  <div class="result-card">
    <h2>Predicted Price</h2>
    <p>{{ prediction_text }}</p>
  </div>
  {% endif %}

</div>

<!-- LocalStorage persistence -->
<script>
  const form = document.querySelector("form");
  const inputs = form.querySelectorAll("input, select");

  // Load saved values
  inputs.forEach(input => {
    if(localStorage.getItem(input.name)) {
      input.value = localStorage.getItem(input.name);
    }
  });

  // Save on change
  inputs.forEach(input => {
    input.addEventListener("change", () => {
      localStorage.setItem(input.name, input.value);
    });
  });
</script>

</body>
</html>
